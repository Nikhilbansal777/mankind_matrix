name: Deploy frontend to NameHero

# Runs on every push to master (i.e. every merged PR) and can also be started by hand.
on:
  push:
    branches: [master]
  workflow_dispatch:

concurrency:
  group: deploy-frontend
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        env:
          CI: "false"   # Create React App treats warnings as errors when CI=true
        run: npm run build

      - name: Check the build output
        run: |
          test -f build/index.html
          test -f build/.htaccess
          ls build/static/js | grep -q '^main\..*\.js$'

      - name: Upload to NameHero over FTPS
        env:
          FTP_HOST: ${{ secrets.FTP_HOST }}
          FTP_USER: ${{ secrets.FTP_USER }}
          LFTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq lftp
          lftp -u "$FTP_USER" "ftp://$FTP_HOST" <<'LFTP'
          set ftp:ssl-force true
          set ftp:ssl-protect-data true
          set net:max-retries 3
          set net:timeout 30
          mirror -R --delete --verbose \
            --exclude-glob index.html \
            --exclude-glob .well-known \
            --exclude-glob cgi-bin \
            --exclude-glob php.ini \
            --exclude-glob .user.ini \
            --exclude-glob error_log \
            build ./
          put -O ./ build/index.html
          bye
          LFTP
