name: Deploy frontend to NameHero

# Runs on every push to master (i.e. every merged PR) and can also be started by hand
# (Actions -> Deploy frontend to NameHero -> Run workflow).
on:
  push:
    branches: [master]
  workflow_dispatch:

# Never run two deployments at the same time (a running deployment is never cancelled midway).
concurrency:
  group: deploy-frontend
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  build-and-deploy:
    # Only ever deploy master, even if the workflow is started by hand from another branch.
    if: github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        env:
          CI: "false"                 # Create React App treats warnings as errors when CI=true
          GENERATE_SOURCEMAP: "false" # do not publish source maps (smaller upload, source not exposed)
        run: npm run build

      - name: Check the build before touching the server
        env:
          API_HOST: ${{ vars.API_HOST || 'api.mankindmatrixai.com' }}
        run: |
          set -euo pipefail
          test -f build/index.html   || { echo "::error::build/index.html is missing"; exit 1; }
          test -f build/.htaccess    || { echo "::error::build/.htaccess is missing (public/.htaccess provides the SPA routing rule)"; exit 1; }
          JS=$(ls build/static/js/main.*.js | head -n 1)
          grep -q "$API_HOST" "$JS" || { echo "::error::The build does not contain the backend address $API_HOST. Is .env on this branch up to date?"; exit 1; }
          if grep -q -E 'onrender\.com|localhost:8085' "$JS"; then
            echo "::error::The build still contains old backend URLs (onrender.com or localhost:8085). Check .env."; exit 1
          fi
          echo "Build looks right: $(find build -type f | wc -l) files, entry point $JS"

      - name: Upload to NameHero over FTPS (new files first, index.html last, stale files removed afterwards)
        timeout-minutes: 10
        env:
          FTP_HOST: ${{ secrets.FTP_HOST }}
          FTP_USER: ${{ secrets.FTP_USER }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
          FTP_TLS_VERIFY: ${{ vars.FTP_TLS_VERIFY || 'yes' }}
        run: |
          set -euo pipefail
          export LC_ALL=C
          WORK=$(mktemp -d); chmod 700 "$WORK"
          CT="${FTP_CONNECT_TIMEOUT:-20}"   # seconds to wait for a connection
          MT="${FTP_MAX_TIME:-120}"         # hard limit for any single transfer

          # Credentials go through a private config file so they never appear in a process list.
          esc() { sed 's/\\/\\\\/g; s/"/\\"/g'; }
          printf 'user = "%s:%s"\n' "$(printf %s "$FTP_USER" | esc)" "$(printf %s "$FTP_PASSWORD" | esc)" > "$WORK/curlrc"
          BASE=(-K "$WORK/curlrc" --silent --show-error --ssl-reqd --connect-timeout "$CT" --max-time "$MT")
          [ "$FTP_TLS_VERIFY" = no ] && BASE+=(--insecure)
          MODE=()
          ftp() { curl "${BASE[@]}" "${MODE[@]}" "$@" < /dev/null; }

          echo "== 0/5 Checking the FTPS connection (explicit TLS, hard time limits)"
          HOST_ONLY="${FTP_HOST%%:*}"; PORT="${FTP_HOST##*:}"; [ "$PORT" = "$FTP_HOST" ] && PORT=21
          getent hosts "$HOST_ONLY" > /dev/null 2>&1 && echo "  DNS lookup: ok" || echo "  DNS lookup: FAILED (check the FTP_HOST secret: it must be a bare host name such as ftp.mindstack-technologies.com)"
          timeout 15 bash -c "exec 3<>/dev/tcp/$HOST_ONLY/$PORT" 2> /dev/null && echo "  TCP port $PORT: reachable" || echo "  TCP port $PORT: NOT reachable from GitHub's runners within 15s"
          CONNECTED=0
          for m in "" "--ftp-skip-pasv-ip" "--disable-epsv" "--ftp-skip-pasv-ip --disable-epsv"; do
            read -r -a MODE <<< "$m"
            if ftp -o /dev/null "ftp://$FTP_HOST/" 2> "$WORK/err.txt"; then
              echo "  login + directory listing: ok (settings: ${m:-default})"; CONNECTED=1; break
            fi
            echo "  login attempt failed with [${m:-default}]: $(head -c 300 "$WORK/err.txt")"
          done
          if [ "$CONNECTED" != 1 ]; then
            echo "::error::Could not log in to the FTP server over FTPS. Check, in this order: (1) secrets FTP_HOST (bare host name, e.g. ftp.mindstack-technologies.com, the FTP server name shown in cPanel under FTP Accounts), FTP_USER (full name, e.g. deploy@mankindmatrixai.com) and FTP_PASSWORD; (2) if the message above says 'SSL certificate problem', set the repository variable FTP_TLS_VERIFY=no as a temporary fallback; (3) if the port is not reachable, NameHero is blocking GitHub's runners - ask NameHero support to allow FTPS (port 21 plus passive ports) from GitHub Actions or to enable SFTP/SSH."
            exit 1
          fi

          ( cd build && find . -type f | sed 's|^\./||' | sort ) > "$WORK/new.txt"

          echo "== 1/5 Reading the manifest of the previous deployment"
          set +e; ftp "ftp://$FTP_HOST/.deploy-manifest.txt" -o "$WORK/old.txt" 2> "$WORK/err.txt"; RC=$?; set -e
          if [ "$RC" = 0 ]; then
            echo "The previous deployment uploaded $(wc -l < "$WORK/old.txt") files"
          elif [ "$RC" = 78 ]; then
            : > "$WORK/old.txt"
            echo "No previous manifest (first pipeline deployment): nothing will be deleted this time"
          else
            echo "::error::Could not read the manifest (curl exit $RC): $(head -c 300 "$WORK/err.txt")"; exit 1
          fi
          sort -o "$WORK/old.txt" "$WORK/old.txt"

          put() {  # $1 = path inside build/ ; the same path is used on the server
            local rel="$1" n=0
            until ftp --ftp-create-dirs -T "build/$rel" "ftp://$FTP_HOST/$rel" 2> "$WORK/err.txt"; do
              n=$((n + 1))
              if [ "$n" -ge 3 ]; then echo "::error::Upload of $rel failed: $(head -c 300 "$WORK/err.txt")"; return 1; fi
              echo "  retrying $rel (attempt $((n + 1)))"; sleep 3
            done
            echo "  uploaded $rel"
          }

          echo "== 2/5 Uploading all files except index.html"
          while IFS= read -r f; do
            [ "$f" = index.html ] && continue
            put "$f"
          done < "$WORK/new.txt"

          echo "== 3/5 Switching the site over: uploading index.html"
          put index.html

          echo "== 4/5 Removing files that earlier deployments uploaded and this build no longer has"
          comm -23 "$WORK/old.txt" "$WORK/new.txt" \
            | { grep -E '^[A-Za-z0-9._/@+-]+$' || true; } \
            | { grep -v -E '(^|/)\.\.(/|$)' || true; } > "$WORK/stale.txt"
          if [ -s "$WORK/stale.txt" ]; then
            ARGS=()
            while IFS= read -r f; do echo "  removing $f"; ARGS+=(-Q "-DELE $f"); done < "$WORK/stale.txt"
            ftp "${ARGS[@]}" -o /dev/null "ftp://$FTP_HOST/" || echo "::warning::Some old files could not be removed (harmless, they are retried on the next deployment)"
          else
            echo "Nothing to remove"
          fi

          echo "== 5/5 Recording what is deployed"
          ftp -T "$WORK/new.txt" "ftp://$FTP_HOST/.deploy-manifest.txt"
          echo "Upload finished"

      - name: Check that the live site serves the new build
        env:
          SITE_URL: ${{ vars.SITE_URL || 'https://mankindmatrixai.com' }}
        run: |
          set -euo pipefail
          MAIN=$(grep -o 'main\.[a-f0-9]*\.js' build/index.html | head -n 1)
          check() {
            local html code
            html=$(curl -fsSL "$SITE_URL/") || return 1
            grep -q "$MAIN" <<< "$html" || { echo "  the home page does not reference $MAIN yet"; return 1; }
            curl -fsSL -o /dev/null "$SITE_URL/static/js/$MAIN" || { echo "  $MAIN is not downloadable yet"; return 1; }
            code=$(curl -sSL -o /dev/null -w '%{http_code}' "$SITE_URL/login") || return 1
            [ "$code" = 200 ] || { echo "  /login returned $code (the SPA routing rule in .htaccess is not working)"; return 1; }
          }
          for i in $(seq 1 "${SMOKE_RETRIES:-6}"); do
            if check; then echo "Live site OK: serves $MAIN and /login works"; exit 0; fi
            echo "Not ready (attempt $i), waiting..."
            sleep "${SMOKE_DELAY:-10}"
          done
          echo "::error::The live site does not serve the new build. To go back, revert the commit on master and push."
          exit 1
